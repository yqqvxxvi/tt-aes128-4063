project:
  title:        "AES-128 Encryption Accelerator (baseline, bit-serial)"
  author:       "SecondChip"
  discord:      ""
  description:  "Baseline AES-128: iterative core with combinational all-round-keys schedule, bit-serial load/readout (unoptimised counterpart of tt_um_aes128_secondchip)"
  language:     "Verilog"
  clock_hz:     25000000
  tiles: "8x2"
  top_module:  "tt_um_aes128_baseline_secondchip"
  source_files:
    - "tt_um_aes128_baseline_secondchip.v"
    - "aes_core_baseline.v"
    - "key_expansion_flat.v"
    - "sbox.v"
    - "subbytes.v"
    - "shiftrows.v"
    - "mixcolumns.v"
    - "addroundkey.v"

pinout:
    ui[0]: "serial_in (data bit)"
    ui[1]: "load_en (shift key+plaintext in)"
    ui[2]: "start (rising edge: begin encrypt)"
    ui[3]: "out_en (shift ciphertext out)"
    ui[4]: ""
    ui[5]: ""
    ui[6]: ""
    ui[7]: ""
    uo[0]: "serial_out (ciphertext bit, MSB first)"
    uo[1]: "busy"
    uo[2]: "done (ciphertext valid)"
    uo[3]: ""
    uo[4]: ""
    uo[5]: ""
    uo[6]: ""
    uo[7]: ""
    uio[0]: ""
    uio[1]: ""
    uio[2]: ""
    uio[3]: ""
    uio[4]: ""
    uio[5]: ""
    uio[6]: ""
    uio[7]: ""

yaml_version: 6
